<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Appelsine Jeck Slot</title>
<style>
  :root {
    --orange: #ff7a00;
    --orange-dark: #e05e00;
    --orange-deep: #a34400;
    --white: #ffffff;
    --cream: #fff6ea;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
  }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      repeating-linear-gradient(45deg, var(--orange) 0 40px, var(--white) 40px 80px);
    font-family: 'Trebuchet MS', Verdana, sans-serif;
  }
  .machine {
    background: linear-gradient(160deg, var(--white), var(--cream));
    border-radius: 24px;
    padding: 30px 26px;
    box-shadow: 0 0 0 7px var(--orange), 0 0 0 11px var(--white), 0 20px 50px rgba(0,0,0,0.35);
    text-align: center;
    width: 100%;
    max-width: 480px;
    margin: 16px;
    position: relative;
    overflow: hidden;
  }
  @media (max-width: 480px) {
    body {
      display: block;
      padding: 0;
    }
    .machine {
      width: 100%;
      max-width: 100%;
      margin: 0;
      border-radius: 0;
      min-height: 100vh;
      padding: 24px 12px;
      box-shadow: none;
      border: 5px solid var(--orange);
      border-left: none;
      border-right: none;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
  }
  .machine::before {
    content: "🍊";
    position: absolute;
    font-size: 60px;
    opacity: 0.08;
    top: -10px;
    right: -10px;
    transform: rotate(15deg);
  }
  h1 {
    color: var(--orange-dark);
    font-size: 21px;
    margin: 0 0 4px;
    letter-spacing: 1px;
  }
  .subtitle {
    color: var(--orange);
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 18px;
  }
  .reels {
    display: flex;
    justify-content: center;
    gap: 12px;
    background: var(--orange-dark);
    border-radius: 14px;
    padding: 18px;
    box-shadow: inset 0 0 12px rgba(0,0,0,0.35);
    margin-bottom: 22px;
  }
  .reel {
    flex: 1 1 0;
    max-width: 140px;
    aspect-ratio: 84 / 100;
    background: #fff;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    box-shadow: 0 0 0 3px var(--white), 0 4px 10px rgba(0,0,0,0.4);
    position: relative;
  }
  .reel img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.1s linear;
  }
  .reel.spinning img {
    animation: blur-spin 0.12s linear infinite;
  }
  @keyframes blur-spin {
    0% { transform: translateY(-6px); }
    50% { transform: translateY(6px); }
    100% { transform: translateY(-6px); }
  }
  button#spin {
    background: linear-gradient(160deg, var(--orange), var(--orange-dark));
    color: white;
    border: 3px solid var(--white);
    border-radius: 50px;
    padding: 13px 38px;
    font-size: 18px;
    font-weight: bold;
    letter-spacing: 1px;
    cursor: pointer;
    box-shadow: 0 6px 0 var(--orange-deep), 0 8px 16px rgba(0,0,0,0.3);
    transition: transform 0.05s ease;
  }
  button#spin:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 var(--orange-deep);
  }
  button#spin:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }
  #result {
    margin-top: 16px;
    min-height: 26px;
    font-size: 16px;
    font-weight: bold;
    color: var(--orange-dark);
  }
  #credits {
    margin-top: 10px;
    color: #a34400;
    font-size: 13px;
    font-weight: bold;
  }
</style>
</head>
<body>

<div class="machine">
  <h1>🍊 APPELSINE JECK 🍊</h1>
  <div class="subtitle">Wo mir sin is orange!</div>
  <div class="reels">
    <div class="reel" id="reel0"><img src="" alt=""></div>
    <div class="reel" id="reel1"><img src="" alt=""></div>
    <div class="reel" id="reel2"><img src="" alt=""></div>
  </div>
  <button id="spin">DREHEN</button>
  <div id="result">Alaaf! Viel Glück!</div>
  <div id="credits">Guthaben: <span id="creditVal">100</span></div>
</div>

  // Maskottchen zahlt am meisten, die restlichen Portraits gleich
  const symbols = [IMG_MASCOT, IMG_P2, IMG_P3, IMG_P4, IMG_P5, IMG_P6];
  const payouts = [50, 20, 20, 20, 20, 20];

  let credits = 100;
  const creditVal = document.getElementById("creditVal");
  const resultEl = document.getElementById("result");
  const spinBtn = document.getElementById("spin");
  const reels = [
    document.getElementById("reel0"),
    document.getElementById("reel1"),
    document.getElementById("reel2")
  ];

  reels.forEach((r, i) => r.querySelector("img").src = symbols[i % symbols.length]);

  function randomIndex() {
    return Math.floor(Math.random() * symbols.length);
  }

  function spinReel(reelEl, duration, finalIndex) {
    return new Promise(resolve => {
      reelEl.classList.add("spinning");
      const img = reelEl.querySelector("img");
      const interval = setInterval(() => {
        img.src = symbols[randomIndex()];
      }, 60);

      setTimeout(() => {
        clearInterval(interval);
        img.src = symbols[finalIndex];
        reelEl.classList.remove("spinning");
        resolve();
      }, duration);
    });
  }

  async function spin() {
    if (credits < 5) {
      resultEl.textContent = "Kein Guthaben mehr!";
      spinBtn.disabled = true;
      return;
    }

    credits -= 5;
    creditVal.textContent = credits;
    spinBtn.disabled = true;
    resultEl.textContent = "Alaaf...";

    const finals = [randomIndex(), randomIndex(), randomIndex()];
    const durations = [800, 1200, 1600];

    await Promise.all(reels.map((reel, i) => spinReel(reel, durations[i], finals[i])));

    if (finals[0] === finals[1] && finals[1] === finals[2]) {
      const win = payouts[finals[0]];
      credits += win;
      resultEl.textContent = `🎉 ALAAF! +${win} 🎉`;
    } else if (finals[0] === finals[1] || finals[1] === finals[2] || finals[0] === finals[2]) {
      credits += 3;
      resultEl.textContent = "Zwei gleiche! +3 Guthaben";
    } else {
      resultEl.textContent = "Leider verloren. Nochmal!";
    }

    creditVal.textContent = credits;
    spinBtn.disabled = false;
  }

  spinBtn.addEventListener("click", spin);
</script>
